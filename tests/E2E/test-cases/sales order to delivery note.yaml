labels:
  - selling
  - stock
customSteps: |
  log in as administrator
  open the selling module
  click "Sales Order"
  click "Add Sales Order" using OCR only
  enter "E2E Seed Customer A" into "Customer"
  press Tab
  enter "2030-01-31" into "Delivery Date"
  press Escape
  click on table at row "1" and column "Item Code"
  type "E2E-SEED-001"
  check that page contains "E2E-SEED-001, Products"
  press Enter
  check that page contains "$ 25.00"
  click "Save" using OCR only
  check that page contains "Draft"
  click "Submit" using OCR only
  click "Yes"
  check that page contains "To Deliver and Bill"
  click "Create"
  click "elivery Note"
  check that page contains "Delivery Note Item"
  click "Save" using OCR only
  click "Submit" using OCR only
  click "Yes"
  check that page contains "To Bill"
  click "View"
  click "tock Ledger"
  check that page contains "Out Qty"
  check that page contains "-1.000"
  check that page contains "Stores - ETC"
